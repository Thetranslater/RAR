[project]
name = "rar-agent"
version = "0.1.0"
description = "Local-first agent for extracting traceable role-play dialogue datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=10,<12",
  "pydantic>=2.10,<3",
  "rapidfuzz>=3.10,<4",
  "sqlalchemy>=2.0,<3",
  "tiktoken>=0.9,<1",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
ocr = [
  "paddleocr[doc-parser]>=3.6,<4",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
rar-agent = "rar_agent.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rar_agent"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "rar_agent/web_dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rar_agent"]

[[tool.mypy.overrides]]
module = ["tiktoken.*"]
ignore_missing_imports = true
